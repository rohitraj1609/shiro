### Environment configuration for the local voice ↔ text app
### This is meant to be used with the Conda environment: `shiro`

# --------- General ---------
APP_NAME: "voice_assistant"

# Base paths (relative to this repo root)
VOICE_INPUT_DIR: "voice/input_voice"
VOICE_OUTPUT_DIR: "voice/output_voice"
TRANSCRIPT_DIR: "transcripts"

# --------- Audio I/O ---------
SAMPLE_RATE: 16000
CHANNELS: 1
INPUT_WAV: "input.wav"

# --------- Whisper STT ---------
WHISPER_MODEL: "small"        # options: tiny, base, small, medium, large
WHISPER_DEVICE: "cpu"         # change to "cuda" if you have a GPU in Conda `shiro`

# --------- Coqui TTS ---------
TTS_MODEL: "tts_models/en/ljspeech/glow-tts"
TTS_USE_GPU: false

# --------- Logging / Debug ---------
LOG_LEVEL: "INFO"